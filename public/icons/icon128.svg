<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="kittyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B99AFF" />
      <stop offset="50%" stop-color="#FFD6E7" />
      <stop offset="100%" stop-color="#C8F2DF" />
    </linearGradient>
    <filter id="cozyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#29213F" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background rounded pill -->
  <rect x="8" y="8" width="112" height="112" rx="36" fill="#FFF8EF" filter="url(#cozyGlow)"/>
  <rect x="10" y="10" width="108" height="108" rx="34" fill="none" stroke="url(#kittyGrad)" stroke-width="4"/>

  <!-- Cat Ears -->
  <polygon points="34,48 44,18 60,38" fill="#B99AFF" rx="4"/>
  <polygon points="39,44 46,24 57,38" fill="#FFD6E7"/>
  <polygon points="94,48 84,18 68,38" fill="#B99AFF" rx="4"/>
  <polygon points="89,44 82,24 71,38" fill="#FFD6E7"/>

  <!-- Cat Face Head -->
  <ellipse cx="64" cy="66" rx="42" ry="36" fill="#FFF8EF" stroke="#29213F" stroke-width="3.5"/>

  <!-- Calico Lavender / Mint spot -->
  <path d="M 32 50 Q 42 42 54 50 Q 48 64 34 68 Z" fill="#B99AFF" opacity="0.35"/>
  <path d="M 96 52 Q 82 44 76 56 Q 84 66 94 66 Z" fill="#FFD6E7" opacity="0.6"/>

  <!-- Cat Eyes (Cozy happy cat smiling eyes) -->
  <path d="M 46 62 Q 52 56 58 62" fill="none" stroke="#29213F" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 70 62 Q 76 56 82 62" fill="none" stroke="#29213F" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Blush Cheeks -->
  <ellipse cx="44" cy="70" rx="6" ry="4" fill="#FFB7D5" opacity="0.7"/>
  <ellipse cx="84" cy="70" rx="6" ry="4" fill="#FFB7D5" opacity="0.7"/>

  <!-- Nose & Mouth -->
  <polygon points="61,68 67,68 64,72" fill="#FF94B8"/>
  <path d="M 64 72 Q 60 78 55 75 M 64 72 Q 68 78 73 75" fill="none" stroke="#29213F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="30" y1="68" x2="18" y2="66" stroke="#29213F" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="74" x2="16" y2="76" stroke="#29213F" stroke-width="2" stroke-linecap="round"/>
  <line x1="98" y1="68" x2="110" y2="66" stroke="#29213F" stroke-width="2" stroke-linecap="round"/>
  <line x1="98" y1="74" x2="112" y2="76" stroke="#29213F" stroke-width="2" stroke-linecap="round"/>

  <!-- Tab Sleep Symbol (Zzz) -->
  <path d="M 88 32 L 96 32 L 88 40 L 96 40" fill="none" stroke="#B99AFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 98 22 L 104 22 L 98 28 L 104 28" fill="none" stroke="#B99AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
